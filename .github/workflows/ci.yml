name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
  
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and run tests
        run: ./mvnw clean test

  codeql:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build project
        run: ./mvnw clean compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
  
  dependency-scan:
    name: Dependency Vulnerability Scan (SCA)
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build application JAR
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t log-analyzer:ci .
  image-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build application JAR
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t log-analyzer:scan .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: log-analyzer:scan
          severity: HIGH

  runtime-test:
    name: Container Runtime Smoke Test
    runs-on: ubuntu-latest
    needs: image-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build application JAR
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t log-analyzer:runtime .

      - name: Run container
        run: |
          docker run -d -p 8080:8080 --name log-analyzer-test log-analyzer:runtime
          sleep 10

      - name: Smoke test endpoint
        run: |
          curl -f http://localhost:8080/ping

      - name: Stop container
        run: docker stop log-analyzer-test

  docker-push:
    name: Push Trusted Image to DockerHub
    runs-on: ubuntu-latest
    needs: runtime-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build application JAR
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/log-analyzer:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/log-analyzer:latest
  k8s-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy application to Kubernetes
        run: |
          kubectl apply -f k8s/
       # DAST: Dynamic Security Testing
      # Why: Find runtime vulnerabilities
      # ------------------------------------------
      - name: Basic DAST - Security Headers Check
        run: |
          echo "### DAST Security Scan Results :shield:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "#### Security Headers Analysis" >> $GITHUB_STEP_SUMMARY
          HEADERS=$(curl -s -I http://localhost:8080/api/tasks)
          echo '' >> $GITHUB_STEP_SUMMARY
          echo "$HEADERS" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY

      - name: DAST - API Endpoint Testing
        run: |
          echo "#### API Endpoint Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test GET endpoints
          echo "| Endpoint | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/tasks)
          echo "| GET /api/tasks | $STATUS | ✅ |" >> $GITHUB_STEP_SUMMARY
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/tasks/health)
          echo "| GET /api/tasks/health | $STATUS | ✅ |" >> $GITHUB_STEP_SUMMARY
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)
          echo "| GET /actuator/health | $STATUS | ✅ |" >> $GITHUB_STEP_SUMMARY

      - name: DAST - SQL Injection Test
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### SQL Injection Test" >> $GITHUB_STEP_SUMMARY
          
          # Test for SQL injection vulnerability
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/api/tasks/1'%20OR%20'1'='1")
          if [ "$RESPONSE" == "400" ] || [ "$RESPONSE" == "404" ]; then
            echo "✅ Application properly rejects SQL injection attempts" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Review needed for SQL injection handling" >> $GITHUB_STEP_SUMMARY
          fi

      - name: DAST - XSS Test
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### XSS Test" >> $GITHUB_STEP_SUMMARY
          
          # Test for XSS vulnerability
          curl -s -X POST http://localhost:8080/api/tasks \
            -H "Content-Type: application/json" \
            -d '{"title":"<script>alert(1)</script>","description":"test"}' \
            > /dev/null || true
          
          RESPONSE=$(curl -s http://localhost:8080/api/tasks)
          if echo "$RESPONSE" | grep -q "<script>"; then
            echo "⚠️ XSS vulnerability detected - review needed" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No obvious XSS vulnerability detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: DAST Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "DAST scan completed. Review findings above." >> $GITHUB_STEP_SUMMARY

